<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>둘운완 — 짝꿍 초대</title>
  <meta name="description" content="짝꿍이 운동 약속을 봐 달래요. 초대 코드를 복사하고 앱을 받아 바로 연결해 보세요.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#FFF8F6">

  <!-- Fixed preview card (KakaoTalk, iMessage, etc.). The code is never in the card.
       No og:url: this page serves every /i/{CODE}, and clients that follow og:url
       (Facebook/Messenger) would open the generic landing without the code. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="둘운완">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="둘운완 — 둘이 보면, 진짜 하게 돼요">
  <meta property="og:description" content="짝꿍이 운동 약속을 봐 달래요. 초대 코드를 복사하고 앱을 받아 바로 연결해 보세요.">
  <meta property="og:image" content="https://nod-try.web.app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="둘운완 — 둘이 보면, 진짜 하게 돼요">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="둘운완 — 둘이 보면, 진짜 하게 돼요">
  <meta name="twitter:description" content="짝꿍이 운동 약속을 봐 달래요. 초대 코드를 복사하고 앱을 받아 바로 연결해 보세요.">
  <meta name="twitter:image" content="https://nod-try.web.app/og.png">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/landing.css">
</head>
<body data-mode="invite">
  <main class="page">
    <div class="brand">
      <img class="icon" src="/favicon.svg" alt="" width="88" height="88">
      <div class="name">둘운완</div>
    </div>

    <h1>짝꿍이 운동 약속을<br>봐 달래요 💌</h1>
    <p class="lead">앱을 설치하고 초대 코드를 입력하면<br>바로 연결돼요.</p>

    <section class="code-card" id="code-card" aria-label="초대 코드" hidden>
      <span class="code-label">초대 코드</span>
      <p class="code" id="code"></p>
    </section>
    <p class="lead" id="missing" hidden>코드를 찾지 못했어요. 받은 메시지에 있는 코드를 앱에서 직접 입력해 주세요.</p>

    <!-- Phones only, when there is a code: opens the installed app at this invite. -->
    <a class="button secondary" id="open-app" href="#" hidden>이미 앱이 있다면 앱에서 열기</a>
    <button type="button" class="button" id="cta">코드 복사하고 앱 받기</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <nav class="stores" id="stores" aria-label="앱 받기" hidden>
      <a id="app-store" href="https://apps.apple.com/kr/app/id6761373605" rel="noopener">App Store</a>
      <a id="play-store" href="https://play.google.com/store/apps/details?id=com.devho.nodtry.app" rel="noopener">Google Play</a>
    </nav>

    <noscript>
      <p class="lead">앱 스토어에서 ‘둘운완’을 받은 뒤, 메시지로 받은 초대 코드를 입력해 주세요.</p>
    </noscript>

    <ul class="points">
      <li><span class="emoji" aria-hidden="true">📸</span><span>운동하면 인증샷 한 장</span></li>
      <li><span class="emoji" aria-hidden="true">❤️</span><span>짝꿍이 원탭으로 인정</span></li>
      <li><span class="emoji" aria-hidden="true">✊</span><span>안 하면 짝꿍이 똑똑</span></li>
    </ul>

    <p class="foot">혼자선 미루는 운동, 둘이 보면 진짜 하게 돼요.</p>
  </main>
  <script src="/assets/landing.js" defer></script>
</body>
</html>
