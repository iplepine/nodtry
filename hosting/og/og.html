<!doctype html>
<!--
  Source of hosting/public/og.png (1200x630 link-preview card). Not deployed.
  Re-render from the repo root with headless Chrome:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
      --screenshot="$PWD/hosting/public/og.png" "file://$PWD/hosting/og/og.html"

  No numeric/efficacy claims on this image (spec §2).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #FFF8F6;
    font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    color: #2B1B21;
    position: relative;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
  }
  .blob.pink { width: 620px; height: 620px; right: -170px; top: -230px; background: #FFE8ED; }
  .blob.yellow { width: 260px; height: 260px; right: 300px; bottom: -150px; background: #FFF1B8; }
  .wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 88px;
  }
  .icon {
    flex: none;
    width: 300px;
    height: 300px;
    border-radius: 72px;
    overflow: hidden;
    box-shadow: 0 28px 60px rgba(217, 38, 83, 0.28);
  }
  .icon svg { width: 300px; height: 300px; display: block; }
  .name {
    font-size: 132px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    color: #D92653;
  }
  .name small {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #6F5C63;
    margin-left: 18px;
  }
  .tag {
    margin-top: 26px;
    font-size: 54px;
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  .chips { display: flex; gap: 12px; margin-top: 34px; }
  .chip {
    padding: 12px 20px;
    border-radius: 999px;
    background: #FFFFFF;
    font-size: 26px;
    font-weight: 700;
    box-shadow: 0 2px 10px rgba(43, 27, 33, 0.06);
  }
  .chip.yellow { background: #FFD84D; }
</style>
</head>
<body>
  <div class="blob pink"></div>
  <div class="blob yellow"></div>
  <div class="wrap">
    <div class="icon">
      <!-- Kim Hong-do "Heart-Check" app icon: yellow half = the partner's 인정, white half = my 오운완. -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B5E"/><stop offset="1" stop-color="#FF3577"/></linearGradient><radialGradient id="glow" cx="0.2" cy="0.16" r="0.8"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient><filter id="lift" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="22"/><feOffset dy="18" result="b"/><feFlood flood-color="#B3123F" flood-opacity="0.30"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><rect width="1024" height="1024" fill="url(#glow)"/><g transform="translate(450.02 630.17) scale(0.9227)" filter="url(#lift)"><path d="M 0.00 171.83 Q -12.02 171.83 -24.04 159.81 L -254.56 -70.71 A 130.00 130.00 0 0 1 -70.71 -254.56 L 0.00 -183.85 Z" fill="#FFD84D"/><path d="M 0.00 171.83 L 0.00 -183.85 L 205.06 -388.91 A 130.00 130.00 0 0 1 388.91 -205.06 L 24.04 159.81 Q 12.02 171.83 0.00 171.83 Z" fill="#FFFFFF"/></g></svg>
    </div>
    <div class="copy">
      <div class="name">둘운완<small>DuoDone</small></div>
      <div class="tag">둘이 보면, 진짜 하게 돼요.</div>
      <div class="chips">
        <span class="chip">📸 오운완 인증샷</span>
        <span class="chip yellow">❤️ 짝꿍의 인정</span>
        <span class="chip">✊ 똑똑</span>
      </div>
    </div>
  </div>
</body>
</html>
